# The CI of cue: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build and typecheck run on Node.js 24 and 26. Then the CLI starts, and
# npm pack --dry-run shows the files of the tarball.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@739fefae6b0dd5a86a1fc54985dcd7fa0c515f5f # main
    with:
      # The install also starts "prepare", which builds dist/ (other repositories install cue from git)
      scripts: build typecheck
      node-versions: '["24", "26"]'
      # The CLI starts, and npm pack shows the files of the tarball
      run: |
        node dist/cli.js --help
        npm pack --dry-run
