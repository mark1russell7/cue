# The CI of cue: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The scripts build, typecheck, check:conventions and test run on Node.js 24 and 26. Then
# the CLI starts, and npm pack --dry-run shows the files of the tarball.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@c216644a252956d695bc2a785e80abccd98fa0d0 # main
    with:
      # The tests of generate need the cue CLI (the version of cue.mod/module.cue). Without it, they skip.
      # The action setup-cue of the template installs it from a cache, or with retries and a sha256 check.
      cue-version: "0.15.1"
      # The install also starts "prepare", which builds dist/ (other repositories install cue from git)
      scripts: build typecheck check:conventions test
      node-versions: '["24", "26"]'
      # The CLI starts, and npm pack shows the files of the tarball. Then the record of cue eval of the
      # site gets a check: it is the output of the CUE files of this commit.
      run: |
        node dist/cli.js --help
        npm pack --dry-run
        pnpm --filter @cue/site run check:cue-table
